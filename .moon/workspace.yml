$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Explicit id → path map. IDs are clean (no dots). The tin libs (csv, zlib,
# docx, pdftotext, jinja2, logging, browser-native, lancedb) left the
# workspace: they are mojoshelf tins now, consumed as pixi source deps.
projects:
  # app lives INSIDE the vault monorepo since the Tier-1 consolidation.
  app-ios: 'vault/app/ios'
  app-server: 'vault/app/server'
  app-web: 'vault/app/web'
  engine: 'engine'
  flare: 'flare'
  json: 'json'
  menu-bar: 'menu-bar'
  vault: 'vault'
  website: 'website'
  # The release pipeline lives with the product (vault monorepo).
  release: 'vault/release'

vcs:
  client: 'git'
  defaultBranch: 'main'

# Don't hash build artifacts / tool caches as task inputs (submodule .gitignore
# isn't always read at the superproject level).
hasher:
  ignorePatterns:
    - '**/.build/**'
    - '**/.pixi/**'
    - '**/node_modules/**'
    - '**/dist/**'
    - '**/build/**'
